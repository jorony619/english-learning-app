        }

            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .progress-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-label {
            font-weight: 600;
            color: #667eea;
        }

        .progress-percentage {
            font-size: 14px;
            color: #666;
        }

        .progress-track {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .week-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .week-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .week-btn:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }

        .week-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .day-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            justify-content: center;
        }

        .day-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f5f5ff;
            transform: scale(1.1);
        }

        .day-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: scale(1.1);
        }

        .day-btn.completed {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .day-btn.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .content-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .day-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }

        .day-date {
            font-size: 14px;
            color: #999;
        }

        .word-card {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .word-card.success {
            border-left-color: #4caf50;
            background: #f0fff4;
        }

        .word-card.pending {
            border-left-color: #ff9800;
            background: #fff8f0;
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .word-en {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .word-cn {
            font-size: 16px;
            color: #666;
            margin-top: 5px;
        }

        .word-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            margin-left: 10px;
        }

        .status-success {
            background: #4caf50;
            color: white;
        }

        .status-pending {
            background: #ff9800;
            color: white;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .play-btn.playing {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
        }

        .examples-section {
            margin-top: 15px;
        }

        .example-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #ddd;
        }

        .example-cn {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .example-en {
            font-size: 15px;
            color: #333;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #667eea;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .example-play-btn.playing {
            animation: pulse 1s infinite;
        }

        .example-play-btn svg {
            width: 14px;
            height: 14px;
        }

        .recording-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #ddd;
        }

        .recording-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .record-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .record-btn.start {
            background: #f44336;
            color: white;
        }

        .record-btn.stop {
            background: #666;
            color: white;
        }

        .record-btn.recording {
            animation: pulse 1s infinite;
        }

        .record-status {
            font-size: 14px;
            color: #666;
        }

        .record-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .record-result.success {
            background: #f0fff4;
            color: #4caf50;
            display: block;
        }

        .record-result.error {
            background: #fff5f5;
            color: #f44336;
            display: block;

            color: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;

            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;

            opacity: 0.5;
            cursor: not-allowed;
        }

            background: #4caf50;
            color: white;
        }

            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;

                height: 45px;

                align-items: stretch;
            }

            weekSelector.innerHTML = '';

            Object.keys(learningData).forEach((weekKey, index) => {
                const week = learningData[weekKey];
                const btn = document.createElement('button');
                btn.className = `week-btn ${currentWeek === weekKey ? 'active' : ''}`;
                btn.textContent = `第${index + 1}周`;
                btn.onclick = () => selectWeek(weekKey);
                weekSelector.appendChild(btn);
            });

            renderDaySelector();
        }

        // 选择周
        function selectWeek(weekKey) {
            currentWeek = weekKey;
            currentDayId = null;
            renderWeekSelector();
            renderDaySelector();
            renderContent();
        }

        // 渲染日期选择器
        function renderDaySelector() {
            const daySelector = document.getElementById('daySelector');
            daySelector.innerHTML = '';

            const weekData = learningData[currentWeek];
            weekData.days.forEach(day => {
                const btn = document.createElement('button');
                const isCompleted = completedDays.includes(day.id);
                const isActive = currentDayId === day.id;
                const isLocked = day.id > 1 && !completedDays.includes(day.id - 1);

                btn.className = `day-btn ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
                btn.textContent = day.id;

                if (!isLocked) {
                    btn.onclick = () => selectDay(day.id);
                }

                daySelector.appendChild(btn);
            });
        }

        // 开始录音
        function startRecording(btn, word, dayId, wordIndex) {
            if (!recognition) {
                alert('您的浏览器不支持语音识别功能，请使用Chrome或Edge浏览器。');
                return;
            }

            if (isRecording) {
                alert('请等待当前录音完成');
                return;
            }

            isRecording = true;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                    <circle cx="12" cy="12" r="6"/>
                </svg>
                正在录音...
            `;
            btn.classList.add('recording');
            btn.classList.remove('start');
            btn.classList.add('stop');

            const statusSpan = btn.nextElementSibling;
            statusSpan.textContent = '请跟读...';

            recognition.dataset.word = word;
            recognition.dataset.dayId = dayId;
            recognition.dataset.wordIndex = wordIndex;

            try {
                recognition.start();
            } catch (error) {
                console.error('Recognition start error:', error);
                stopRecording(btn, false);
            }

            // 设置超时，5秒后自动停止
            setTimeout(() => {
                if (isRecording) {
                    recognition.stop();
                }
            }, 5000);
        }

        // 停止录音
        function stopRecording(btn, success) {
            isRecording = false;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>

                </svg>
                ${success ? '重新跟读' : '点击跟读'}
            `;
            btn.classList.remove('recording');
            btn.classList.remove('stop');
            btn.classList.add('start');
        }

        // 检查发音
        function checkPronunciation(transcript, targetWord) {
            const dayId = recognition.dataset.dayId;
            const wordIndex = recognition.dataset.wordIndex;
            const wordCard = document.getElementById(`word-${dayId}-${wordIndex}`);
            const recordBtn = wordCard.querySelector('.record-btn');
            const resultDiv = document.getElementById(`result-${dayId}-${wordIndex}`);

            // 清理目标单词，移除括号内容
            const cleanTarget = targetWord.replace(/\s*\([^)]*\)\s*/g, '').toLowerCase().trim();
            const cleanTranscript = transcript.toLowerCase().trim();

            // 模糊匹配：检查是否包含目标单词
            const isMatch = cleanTranscript.includes(cleanTarget) ||
                          cleanTarget.includes(cleanTranscript) ||
                          calculateSimilarity(cleanTranscript, cleanTarget) > 0.7;

            const stateKey = `${dayId}_${wordIndex}`;
            recordingStates[stateKey] = {
                attempted: true,
                success: isMatch,
                transcript: cleanTranscript,
                timestamp: Date.now()
            };

            // 保存到localStorage
            localStorage.setItem('recordingStates', JSON.stringify(recordingStates));

            if (isMatch) {
                resultDiv.className = 'record-result success';
                resultDiv.textContent = `✓ 跟读正确！识别到: "${transcript}"`;
                stopRecording(recordBtn, true);
                renderContent(); // 重新渲染以更新状态
            } else {
                resultDiv.className = 'record-result error';
                resultDiv.textContent = `✕ 跟读未通过，请再试一次。识别到: "${transcript}"`;
                stopRecording(recordBtn, false);
            }
        }

        // 计算字符串相似度（编辑距离）
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;

            if (longer.length === 0) return 1.0;

            const costs = [];
            for (let i = 0; i <= longer.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= shorter.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        }
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[shorter.length] = lastValue;
            }

            return (longer.length - costs[shorter.length]) / longer.length;
        }

        // 获取当日已完成的单词数
        function getDayCompletedCount(dayId) {
            let count = 0;
            for (let i = 0; i < 5; i++) {
                const stateKey = `${dayId}_${i}`;
                if (recordingStates[stateKey] && recordingStates[stateKey].success) {
                    count++;
                }
            }
            return count;
        }

        // 完成当日打卡
        function completeDay(dayId) {
            if (getDayCompletedCount(dayId) < 5) {
                alert('请先完成所有5个单词的跟读！');
                return;
            }

            completedDays.push(dayId);
            localStorage.setItem('completedDays', JSON.stringify(completedDays));
            updateProgress();
            renderDaySelector();
            renderContent();

            // 显示成功提示
            alert(`🎉 恭喜！Day ${dayId} 打卡成功！明天可以学习 Day ${dayId + 1} 了！`);
        }

        // 加载跟读状态
        function loadRecordingStates() {
            const saved = localStorage.getItem('recordingStates');
            if (saved) {
                recordingStates = JSON.parse(saved);
            }
        }

        // 播放单词发音
        function playWord(text) {
            // 确保音频已初始化
            initAudio();

            // 取消当前播放
            if (currentSpeech) {
                currentSpeech.cancel();
            }

            currentSpeech = new SpeechSynthesisUtterance(text);
            currentSpeech.lang = 'en-US';

            // 移动端优化：降低播放速度
            if (isMobile()) {
                currentSpeech.rate = 0.7;
            } else {
                currentSpeech.rate = 0.8;
            }

            currentSpeech.pitch = 1;
            currentSpeech.volume = 1;

            // 移动端错误处理
            currentSpeech.onerror = (event) => {
                console.error('Speech synthesis error:', event.error);
                // iOS Safari有时会出错，尝试重试一次
                if (event.error === 'interrupted' || event.error === 'canceled') {
                    return;
                }
            };

            currentSpeech.onend = () => {
                document.querySelectorAll('.play-btn').forEach(btn => btn.classList.remove('playing'));
            };

            const playBtn = event.currentTarget;
            playBtn.classList.add('playing');

            // 移动端：先取消所有待播放的音频
            window.speechSynthesis.cancel();
            setTimeout(() => {
                window.speechSynthesis.speak(currentSpeech);
            }, 100);
        }

        // 播放例句发音
        function playExample(text, btn) {
            // 确保音频已初始化
            initAudio();

            // 取消当前播放
            if (currentSpeech) {
                currentSpeech.cancel();
            }

            currentSpeech = new SpeechSynthesisUtterance(text);
            currentSpeech.lang = 'en-US';

            // 移动端优化：降低播放速度
            if (isMobile()) {
                currentSpeech.rate = 0.65;
            } else {
                currentSpeech.rate = 0.75;
            }

            currentSpeech.pitch = 1;
            currentSpeech.volume = 1;

            currentSpeech.onend = () => {
                document.querySelectorAll('.example-play-btn').forEach(b => b.classList.remove('playing'));
            };

            btn.classList.add('playing');

            // 移动端：先取消所有待播放的音频
            window.speechSynthesis.cancel();
            setTimeout(() => {
                window.speechSynthesis.speak(currentSpeech);
            }, 100);
        }

        // 更新进度
        function updateProgress() {
            const totalDays = 20;
            const progress = (completedDays.length / totalDays) * 100;

            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressPercentage').textContent = `${Math.round(progress)}%`;
        }

        // 启动应用
        init();
    </script>
</body>
</html>
