    // 音频播放器类
    // ==========================================
    class AudioPlayer {
      constructor() {
        this.synthesis = window.speechSynthesis;
        this.initVoices();
        this.currentUtterance = null;
        this.isPlaying = false;
        this.onEndCallbacks = [];
        this.isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        this.isHarmonyOS = /HarmonyOS/i.test(navigator.userAgent) || /OpenHarmony/i.test(navigator.userAgent);
        this.audioContext = null;
        this.initAudioContext();
      }

      initAudioContext() {
        try {
          if (typeof AudioContext !== 'undefined') {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
        } catch (e) {
          console.warn('AudioContext not supported:', e);
        }
      }

      // iOS 和 HarmonyOS 需要用户交互后才能播放音频
      async initAudio() {
        if ((this.isIOS || this.isHarmonyOS) && this.audioContext && this.audioContext.state === 'suspended') {
          try {
            await this.audioContext.resume();
          } catch (e) {
            console.warn('Failed to resume AudioContext:', e);
          }
        }

        // 确保 Web Speech API 已初始化
        if (this.synthesis.getVoices().length === 0) {
          this.synthesis.getVoices();
        }
      }

      initVoices() {
        // 立即尝试加载语音列表
        const voices = this.synthesis.getVoices();

        if (voices.length === 0) {
          this.synthesis.onvoiceschanged = () => {
            console.log('语音列表已加载:', this.synthesis.getVoices().length);
          };
        } else {
          console.log('语音列表已加载:', voices.length);
        }
      }

      getEnglishVoice() {
        const voices = this.synthesis.getVoices();
        let voice = voices.find(v => v.name.includes('Google US English'));
        if (voice) return voice;

        voice = voices.find(v => v.name.includes('Microsoft') && v.lang.includes('en-US'));
        if (voice) return voice;

        voice = voices.find(v => v.lang.includes('en'));
        if (voice) return voice;

        return voices[0] || null;
      }

      async play(text, config = {}) {
        try {
          // 初始化音频（特别是 iOS 和 HarmonyOS）
          await this.initAudio();

          return new Promise((resolve, reject) => {
            this.stop();

            const utterance = new SpeechSynthesisUtterance(text);

            const voice = this.getEnglishVoice();
            if (voice) {
              utterance.voice = voice;
            }

            utterance.rate = config.rate ?? 0.9;
            utterance.pitch = config.pitch ?? 1;
            utterance.volume = config.volume ?? 1;
            utterance.lang = config.lang ?? 'en-US';

            utterance.onend = () => {
              this.isPlaying = false;
              this.currentUtterance = null;
              this.onEndCallbacks.forEach(cb => cb());
              this.onEndCallbacks = [];
              resolve();
            };

            utterance.onerror = (event) => {
              this.isPlaying = false;
              this.currentUtterance = null;
              this.onEndCallbacks.forEach(cb => cb());
              this.onEndCallbacks = [];
              console.error('语音播放错误:', event.error);
              reject(new Error(`语音播放失败: ${event.error}`));
            };

            utterance.onstart = () => {
              this.isPlaying = true;
            };

            this.currentUtterance = utterance;

            // iOS 和 HarmonyOS 需要延迟一下
            const delay = this.isIOS || this.isHarmonyOS ? 50 : 10;
            setTimeout(() => {
              try {
                this.synthesis.speak(utterance);
              } catch (error) {
                console.error('speak 方法调用失败:', error);
                reject(new Error(`语音播放失败: ${error.message}`));
              }
            }, delay);
          });
        } catch (error) {
          console.error('播放失败:', error);
          throw error;
        }
      }

      stop() {
        if (this.currentUtterance && this.isPlaying) {
          this.synthesis.cancel();
          this.isPlaying = false;
          this.currentUtterance = null;
          this.onEndCallbacks.forEach(cb => cb());
          this.onEndCallbacks = [];
        }
      }

      stopAll() {
        this.stop();
        this.synthesis.cancel();
      }

      async playRecording(audioData) {
        try {
          // 初始化音频（特别是 iOS）
          await this.initAudio();

          return new Promise((resolve, reject) => {
            this.stop();
            this.synthesis.cancel();

            const audio = new Audio(audioData);

            audio.onended = () => {
              resolve();
            };

            audio.onerror = (event) => {
              console.error('音频播放错误:', event);
              reject(new Error('音频播放失败'));
            };

            // 加载音频后再播放
            audio.load();

            // iOS 需要延迟一下
            const playPromise = audio.play();

            if (playPromise !== undefined) {
              playPromise.catch(error => {
                console.error('播放失败:', error);
                reject(error);
              });
            }
          });
        } catch (error) {
          console.error('playRecording 失败:', error);
          throw error;
        }
      }
    }

    // 录音管理器类
    // ==========================================
    class RecordingManager {
      constructor(config = {}) {
        this.config = config;
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.startTime = 0;
        this.timerInterval = null;
        this.state = {
          isRecording: false,
          duration: 0,
          audioBlob: null
        };
        this.isHarmonyOS = this.detectHarmonyOS();
        this.isMobile = this.detectMobile();
      }

      detectHarmonyOS() {
        const ua = navigator.userAgent;
        return /HarmonyOS/i.test(ua) || /OpenHarmony/i.test(ua);
      }

      detectMobile() {
        const ua = navigator.userAgent;
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      }

      getAudioConstraints() {
        // 鸿蒙系统需要特殊配置
        if (this.isHarmonyOS) {
          return {
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              channelCount: 1,
              sampleRate: 16000
            }
          };
        }

        // 移动端（包括微信浏览器）使用宽松配置
        if (this.isMobile) {
          return {
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              channelCount: 1
            }
          };
        }

        // PC 端使用理想配置
        return {
          audio: {
            echoCancellation: { ideal: true },
            noiseSuppression: { ideal: true },
            autoGainControl: { ideal: true }
          }
        };
      }

      getSupportedMimeType() {
        // 移动端优先选择 MP4 或 AAC 格式
        if (this.isMobile) {
          const mobileMimeTypes = [
            'audio/mp4',
            'audio/mpeg',
            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/wav'
          ];

          for (const mimeType of mobileMimeTypes) {
            if (MediaRecorder.isTypeSupported(mimeType)) {
              return mimeType;
            }
          }
        }

        // PC 端和其他情况
        const mimeTypes = [
          'audio/webm;codecs=opus',
          'audio/webm',
          'audio/ogg;codecs=opus',
          'audio/ogg',
          'audio/wav',
          'audio/mp4',
          'audio/mpeg'
        ];

        for (const mimeType of mimeTypes) {
          if (MediaRecorder.isTypeSupported(mimeType)) {
            return mimeType;
          }
        }

        return '';
      }

      async startRecording() {
        try {
          if (this.state.isRecording) {
            await this.stopRecording();
          }

          const stream = await navigator.mediaDevices.getUserMedia(
            this.getAudioConstraints()
          );

          const mimeType = this.getSupportedMimeType();

          this.mediaRecorder = new MediaRecorder(stream, {
            mimeType: mimeType || undefined,
            audioBitsPerSecond: 128000
          });

          this.audioChunks = [];

          this.mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              this.audioChunks.push(event.data);
            }
          };

          this.mediaRecorder.onstop = () => {
            this.finalizeRecording();
          };

          this.mediaRecorder.start(1000);
          this.startTime = Date.now();
          this.state.isRecording = true;
          this.state.duration = 0;

          this.startTimer();

        } catch (error) {
          console.error('录音启动失败:', error);
          this.state.isRecording = false;
          if (this.config.onError) {
            this.config.onError(error instanceof Error ? error : new Error(String(error)));
          }
          throw error;
        }
      }

      startTimer() {
        this.timerInterval = window.setInterval(() => {
          this.state.duration = Math.floor((Date.now() - this.startTime) / 1000);

          if (this.config.maxDuration && this.state.duration >= this.config.maxDuration) {
            this.stopRecording();
          } else if (this.config.onDurationChange) {
            this.config.onDurationChange(this.state.duration);
          }
        }, 100);
      }

      stopTimer() {
        if (this.timerInterval !== null) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }

      async stopRecording() {
        return new Promise((resolve, reject) => {
          if (!this.mediaRecorder || this.mediaRecorder.state === 'inactive') {
            reject(new Error('录音未开始'));
            return;
          }

          const originalOnStop = this.mediaRecorder.onstop;

          this.mediaRecorder.onstop = () => {
            this.stopTimer();
            this.state.isRecording = false;

            if (originalOnStop && this.mediaRecorder) {
              originalOnStop.call(this.mediaRecorder, new Event('stop'));
            }

            if (this.state.audioBlob) {
              resolve(this.state.audioBlob);
            } else {
              reject(new Error('录音数据为空'));
            }
          };

          this.mediaRecorder.stop();

          if (this.mediaRecorder.stream) {
            this.mediaRecorder.stream.getTracks().forEach(track => {
              track.stop();
            });
          }
        });
      }

      finalizeRecording() {
        if (this.audioChunks.length === 0) {
          console.warn('没有录制到音频数据');
          return;
        }

        const mimeType = this.getSupportedMimeType() || 'audio/webm';
        this.state.audioBlob = new Blob(this.audioChunks, { type: mimeType });

        if (this.config.onStop) {
          this.config.onStop(this.state.audioBlob);
        }
      }

      async cancelRecording() {
        if (!this.mediaRecorder || this.mediaRecorder.state === 'inactive') {
          return;
        }

        this.stopTimer();
        this.state.isRecording = false;
        this.state.audioBlob = null;
        this.audioChunks = [];

        this.mediaRecorder.stop();

        if (this.mediaRecorder.stream) {
          this.mediaRecorder.stream.getTracks().forEach(track => {
            track.stop();
          });
        }
      }

      getState() {
        return { ...this.state };
      }

      getIsHarmonyOS() {
        return this.isHarmonyOS;
      }

      destroy() {
        this.stopTimer();

        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
          this.mediaRecorder.stop();
          this.mediaRecorder.stream.getTracks().forEach(track => {
            track.stop();
          });
        }

        this.mediaRecorder = null;
        this.audioChunks = [];
        this.state = {
          isRecording: false,
          duration: 0,
          audioBlob: null
        };
      }
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // ==========================================
    // 学习录音管理器类
    // ==========================================
    class LearningRecorder {
      constructor(config = {}) {
        this.config = config;
        this.state = {
          isRecording: false,
          isHolding: false,
          showConfirmation: false,
          duration: 0,
          audioBlob: null
        };

        this.recordingManager = new RecordingManager({
          maxDuration: config.maxDuration || 30,
          onStop: (audioBlob) => this.handleRecordingComplete(audioBlob),
          onError: (error) => this.handleError(error),
          onDurationChange: (duration) => this.handleDurationChange(duration)
        });
      }

      async startHoldRecording() {
        try {
          if (this.state.isRecording) {
            await this.cancelRecording();
          }

          await this.recordingManager.startRecording();

          this.state.isRecording = true;
          this.state.isHolding = true;
          this.state.showConfirmation = false;

          if (this.config.onHoldStart) {
            this.config.onHoldStart();
          }

        } catch (error) {
          console.error('按住录音启动失败:', error);
          if (this.config.onError) {
            this.config.onError(error instanceof Error ? error : new Error(String(error)));
          }
          throw error;
        }
      }

      releaseHold() {
        if (!this.state.isRecording) return;

        this.state.isHolding = false;
        this.state.showConfirmation = true;

        if (this.config.onHoldRelease) {
          this.config.onHoldRelease();
        }
      }

      async confirmStopRecording() {
        if (!this.state.showConfirmation) {
          throw new Error('没有待确认的录音');
        }

        try {
          this.state.showConfirmation = false;
          const audioBlob = await this.recordingManager.stopRecording();

          return audioBlob;
        } catch (error) {
          console.error('停止录音失败:', error);
          throw error;
        }
      }

      continueRecording() {
        this.state.showConfirmation = true;
      }

      async cancelRecording() {
        if (!this.state.isRecording) return;

        this.state.showConfirmation = false;
        await this.recordingManager.cancelRecording();

        this.state.isRecording = false;
        this.state.isHolding = false;
        this.state.duration = 0;
        this.state.audioBlob = null;

        if (this.config.onRecordingCancel) {
          this.config.onRecordingCancel();
        }
      }

      handleRecordingComplete(audioBlob) {
        this.state.isRecording = false;
        this.state.isHolding = false;
        this.state.audioBlob = audioBlob;

        if (this.config.onStop) {
          this.config.onStop(audioBlob);
        }
      }

      handleDurationChange(duration) {
        this.state.duration = duration;

        if (this.config.onDurationChange) {
          this.config.onDurationChange(duration);
        }
      }

      handleError(error) {
        this.state.isRecording = false;
        this.state.isHolding = false;
        this.state.showConfirmation = false;

        if (this.config.onError) {
          this.config.onError(error);
        }
      }

      getState() {
        return { ...this.state };
      }

      getFormattedDuration() {
        return formatDuration(this.state.duration);
      }

      getIsHarmonyOS() {
        return this.recordingManager.getIsHarmonyOS();
      }

      destroy() {
        this.recordingManager.destroy();
        this.state = {
          isRecording: false,
          isHolding: false,
          showConfirmation: false,
          duration: 0,
          audioBlob: null
        };
      }
    }

    function createHoldRecordingButton(button, recorder, onRecordingComplete) {
      let holdStartTime = 0;
      let holdTimer = null;

      const MIN_HOLD_TIME = 200;

      const handleStart = async (e) => {
        try {
          e.preventDefault();
        } catch (err) {
          // 忽略 preventDefault 错误
        }
        holdStartTime = Date.now();

        holdTimer = window.setTimeout(async () => {
          try {
            await recorder.startHoldRecording();
            button.classList.add('recording');
          } catch (error) {
            console.error('录音启动失败:', error);
          }
        }, MIN_HOLD_TIME);
      };

      const handleEnd = (e) => {
        try {
          e.preventDefault();
        } catch (err) {
          // 忽略 preventDefault 错误
        }

        if (holdTimer !== null) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }

        const holdDuration = Date.now() - holdStartTime;

        if (holdDuration < MIN_HOLD_TIME) {
          return;
        }

        if (recorder.getState().isRecording) {
          button.classList.remove('recording');
          recorder.releaseHold();
          showStopConfirmationDialog(recorder, onRecordingComplete);
        }
      };

      button.addEventListener('touchstart', handleStart, { passive: false });
      button.addEventListener('touchend', handleEnd, { passive: false });
      button.addEventListener('touchcancel', handleEnd, { passive: false });

      button.addEventListener('mousedown', handleStart);
      button.addEventListener('mouseup', handleEnd);
      button.addEventListener('mouseleave', handleEnd);

      return () => {
        button.removeEventListener('touchstart', handleStart);
        button.removeEventListener('touchend', handleEnd);
        button.removeEventListener('touchcancel', handleEnd);
        button.removeEventListener('mousedown', handleStart);
        button.removeEventListener('mouseup', handleEnd);
        button.removeEventListener('mouseleave', handleEnd);

        if (holdTimer !== null) {
          clearTimeout(holdTimer);
        }
      };
    }

    // ==========================================
    // 进度管理器类
    // ==========================================
    class ProgressManager {
      constructor() {
        this.STORAGE_KEY = 'english_learning_progress';
        this.progress = this.loadProgress();
      }

      loadProgress() {
        try {
          const saved = localStorage.getItem(this.STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            const wordProgress = new Map();
            if (parsed.wordProgress) {
              Object.entries(parsed.wordProgress).forEach(([key, value]) => {
                wordProgress.set(key, value);
              });
            }
            return {
              ...parsed,
              wordProgress
            };
          }
        } catch (error) {
          console.error('加载进度失败:', error);
        }

        return {
          currentWeek: 0,
          currentDay: 0,
          completedDays: [],
          unlockedDays: [0],
          wordProgress: new Map()
        };
      }

      saveProgress() {
        try {
          const wordProgress = {};
          this.progress.wordProgress.forEach((value, key) => {
            wordProgress[key] = value;
          });

          const dataToSave = {
            ...this.progress,
            wordProgress
          };

          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(dataToSave));
        } catch (error) {
          console.error('保存进度失败:', error);
        }
      }

      getProgress() {
        return { ...this.progress };
      }

      selectDay(weekIndex, dayIndex) {
        const globalDayIndex = weekIndex * 5 + dayIndex;

        // 移除解锁检查，所有天数都可以访问

        this.progress.currentWeek = weekIndex;
        this.progress.currentDay = globalDayIndex;
        this.saveProgress();
        return true;
      }

      isDayUnlocked(globalDayIndex) {
        // 移除解锁限制，所有天数都可以访问
        return true;
      }

      isDayCompleted(globalDayIndex) {
        return this.progress.completedDays.includes(globalDayIndex);
      }

      getWordKey(globalDayIndex, wordIndex) {
        return `day_${globalDayIndex}_word_${wordIndex}`;
      }

      saveWordRecording(globalDayIndex, wordIndex, audioBlob) {
        const key = this.getWordKey(globalDayIndex, wordIndex);
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64data = reader.result;

          if (!this.progress.wordProgress.has(key)) {
            this.progress.wordProgress.set(key, {
              wordRecorded: false,
              examplesRecorded: [false, false],
              audioData: ''
            });
          }

          const current = this.progress.wordProgress.get(key);
          current.wordRecorded = true;
          current.audioData = base64data;

          this.saveProgress();
        };
        reader.readAsDataURL(audioBlob);
      }

      saveExampleRecording(globalDayIndex, wordIndex, exampleIndex, audioBlob) {
        const key = this.getWordKey(globalDayIndex, wordIndex);
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64data = reader.result;

          if (!this.progress.wordProgress.has(key)) {
            this.progress.wordProgress.set(key, {
              wordRecorded: false,
              examplesRecorded: [false, false],
              audioData: {
                word: '',
                examples: []
              }
            });
          }

          const current = this.progress.wordProgress.get(key);
          if (!current.audioData || typeof current.audioData === 'string') {
            current.audioData = {
              word: (current.audioData) || '',
              examples: []
            };
          }

          current.audioData.examples[exampleIndex] = base64data;
          current.examplesRecorded[exampleIndex] = true;

          this.saveProgress();
        };
        reader.readAsDataURL(audioBlob);
      }

      getWordRecording(globalDayIndex, wordIndex) {
        const key = this.getWordKey(globalDayIndex, wordIndex);
        const progress = this.progress.wordProgress.get(key);

        if (!progress) return null;

        if (typeof progress.audioData === 'string') {
          return progress.audioData;
        }

        if (progress.audioData && typeof progress.audioData === 'object') {
          return progress.audioData.word || null;
        }

        return null;
      }

      getExampleRecording(globalDayIndex, wordIndex, exampleIndex) {
        const key = this.getWordKey(globalDayIndex, wordIndex);
        const progress = this.progress.wordProgress.get(key);

        if (!progress || !progress.audioData || typeof progress.audioData === 'string') {
          return null;
        }

        return progress.audioData.examples?.[exampleIndex] || null;
      }

      isWordRecorded(globalDayIndex, wordIndex) {
        const key = this.getWordKey(globalDayIndex, wordIndex);
        return this.progress.wordProgress.get(key)?.wordRecorded || false;
      }

      isExampleRecorded(globalDayIndex, wordIndex, exampleIndex) {
        const key = this.getWordKey(globalDayIndex, wordIndex);
        return this.progress.wordProgress.get(key)?.examplesRecorded?.[exampleIndex] || false;
      }

      canCheckIn(globalDayIndex) {
        if (this.isDayCompleted(globalDayIndex)) {
          return false;
        }

        const weekIndex = Math.floor(globalDayIndex / 5);
        const dayIndex = globalDayIndex % 5;
        const dayData = learningData[weekIndex].days[dayIndex];

        for (let wordIndex = 0; wordIndex < dayData.words.length; wordIndex++) {
          if (!this.isWordRecorded(globalDayIndex, wordIndex)) {
            return false;
          }

          for (let exampleIndex = 0; exampleIndex < dayData.words[wordIndex].examples.length; exampleIndex++) {
            if (!this.isExampleRecorded(globalDayIndex, wordIndex, exampleIndex)) {
              return false;
            }
          }
        }

        return true;
      }

      checkIn(globalDayIndex) {
        if (!this.canCheckIn(globalDayIndex)) {
          return false;
        }

        this.progress.completedDays.push(globalDayIndex);

        const nextDayIndex = globalDayIndex + 1;
        if (nextDayIndex < 20 && !this.progress.unlockedDays.includes(nextDayIndex)) {
          this.progress.unlockedDays.push(nextDayIndex);
        }

        this.saveProgress();
        return true;
      }

      getOverallProgress() {
        const totalDays = 20;
        const completedDays = this.progress.completedDays.length;
        return Math.round((completedDays / totalDays) * 100);
      }
    }

    // 检测是否在微信浏览器中
    let isWeChat = (function() {
      const ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('micromessenger') !== -1;

    let currentWeekIndex = 0;
    let currentDayIndex = 0;
    let currentGlobalDayIndex = 0;

    function calculateTodayIndex() {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth();
      const currentDate = today.getDate();

      if (currentYear !== 2026 || currentMonth !== 2) {
        return -1;
      }

      const dayIndex = currentDate - 2;

      if (dayIndex < 0 || dayIndex > 25) {
        return -1;
      }

      const weekDay = today.getDay();
      if (weekDay === 0 || weekDay === 6) {
        return -1;
      }

      const weekNumber = Math.floor(dayIndex / 7);
      const dayInWeek = weekDay - 1;

      const globalIndex = weekNumber * 5 + dayInWeek;

      if (globalIndex >= 0 && globalIndex < 20) {
        return globalIndex;
      }

      return -1;
    }

    function detectHarmonyOS() {
      const ua = navigator.userAgent;
      const isHarmonyOS = /HarmonyOS/i.test(ua) || /OpenHarmony/i.test(ua);

      if (isHarmonyOS) {
        const alert = document.getElementById('harmonyosAlert');
        if (alert) {
          alert.classList.add('show');
        }
      }
    }

    function renderApp(app) {
      const today = new Date();
      const todayStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
      const todayWeekDay = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][today.getDay()];

      const todayIndex = calculateTodayIndex();
      let todayInfo = '';
      if (todayIndex >= 0) {
        const weekNum = Math.floor(todayIndex / 5) + 1;
        todayInfo = ` | 今日：第${weekNum}周 · ${todayStr} ${todayWeekDay}`;
      } else if (today.getFullYear() < 2026 || (today.getFullYear() === 2026 && today.getMonth() < 2)) {
        todayInfo = ` | 今日：${todayStr} ${todayWeekDay} （学习计划将于2026年3月2日开始）`;
      } else {
        todayInfo = ` | 今日：${todayStr} ${todayWeekDay}`;
      }

      app.innerHTML = `
        <div class="container">
          <div class="header">
            <h1>📚 印刷英语专业说</h1>
            <p>30天系统学习计划 | 每日10-15分钟 | 跟读打卡${todayInfo}</p>
          </div>

          <div class="harmonyos-alert" id="harmonyosAlert">
            <h3>⚠️ 华为鸿蒙系统用户请注意</h3>
            <p>检测到您使用的是鸿蒙系统，音频播放功能可能受限。</p>
            <ul class="tips">
              <li>• <strong>音频播放</strong>：点击播放按钮可能会没有声音</li>
              <li>• <strong>录音功能</strong>：录音功能可以正常使用</li>
              <li>• <strong>文字学习</strong>：可以正常查看单词和例句</li>
              <li>• <strong>建议</strong>：使用 Chrome 浏览器或微信内置浏览器可能改善体验</li>
              <li>• <strong>最佳方案</strong>：使用微信小程序版本获得完整体验</li>
            </ul>
          </div>

          <div class="progress-section">
            <div class="plan-info">
              <span class="plan-date">📅 学习计划：2026年3月2日 - 3月27日</span>
              <span class="plan-total">共20天（4周 × 5天）</span>
            </div>

            <div class="progress-bar">
              <span class="progress-label">学习进度</span>
              <span class="progress-percentage" id="progressPercentage">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="week-selector" id="weekSelector"></div>
            <div class="day-selector" id="daySelector"></div>
          </div>

          <div class="content-card" id="contentCard">
            <div class="empty-state">
              <p>选择一个星期和日期开始学习</p>
            </div>
          </div>
        </div>
      `;

      updateProgress();
      renderWeekSelector();
      renderDaySelector();

      requestAnimationFrame(() => {
        loadCurrentContent();
      });
    }

    function updateProgress() {
      const progress = progressManager.getOverallProgress();
      document.getElementById('progressPercentage').textContent = `${progress}%`;
      document.getElementById('progressFill').style.width = `${progress}%`;
    }

    function renderWeekSelector() {
      const selector = document.getElementById('weekSelector');
      selector.innerHTML = '';

      learningData.forEach((week, index) => {
        const btn = document.createElement('button');
        btn.className = `week-btn ${index === currentWeekIndex ? 'active' : ''}`;
        btn.textContent = `第${index + 1}周`;
        btn.addEventListener('click', () => selectWeek(index));
        selector.appendChild(btn);
      });
    }

    function renderDaySelector() {
      const selector = document.getElementById('daySelector');
      selector.innerHTML = '';

      const weekData = learningData[currentWeekIndex];

      weekData.days.forEach((day, index) => {
        const globalDayIndex = currentWeekIndex * 5 + index;
        const isCompleted = progressManager.isDayCompleted(globalDayIndex);

        const btn = document.createElement('button');
        btn.className = `day-btn ${globalDayIndex === currentGlobalDayIndex ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;

        btn.innerHTML = `
          <span class="day-number">${day.dayOfWeek === '周一' ? '一' : day.dayOfWeek === '周二' ? '二' : day.dayOfWeek === '周三' ? '三' : day.dayOfWeek === '周四' ? '四' : '五'}</span>
          <span class="day-label">${day.date}</span>
          ${isCompleted ? '<span class="check-icon">✓</span>' : ''}
        `;

        // 所有天数都可以访问，移除解锁检查
        btn.addEventListener('click', () => selectDay(globalDayIndex));

        selector.appendChild(btn);
      });
    }

    function selectWeek(weekIndex) {
      currentWeekIndex = weekIndex;
      currentDayIndex = 0;

      const globalDayIndex = weekIndex * 5;
      selectDay(globalDayIndex);
    }

    function selectDay(globalDayIndex) {
      // 移除解锁检查，所有天数都可以访问

      if (progressManager.selectDay(
        Math.floor(globalDayIndex / 5),
        globalDayIndex % 5
      )) {
        currentGlobalDayIndex = globalDayIndex;
        currentWeekIndex = Math.floor(globalDayIndex / 5);
        currentDayIndex = globalDayIndex % 5;

        renderWeekSelector();
        renderDaySelector();
        loadCurrentContent();
      }
    }

    function loadCurrentContent() {
      const contentCard = document.getElementById('contentCard');
      const weekData = learningData[currentWeekIndex];

      if (!weekData || !weekData.days || !weekData.days[currentDayIndex]) {
        contentCard.innerHTML = `
          <div class="empty-state">
            <p>❌ 学习数据加载失败</p>
            <p style="font-size: 12px; margin-top: 10px;">请刷新页面重试</p>
          </div>
        `;
        return;
      }

      const dayData = weekData.days[currentDayIndex];
      const isCompleted = progressManager.isDayCompleted(currentGlobalDayIndex);

      contentCard.innerHTML = `
        <div class="day-header">
          <h2 class="day-title">第${currentWeekIndex + 1}周 · ${dayData.date} ${dayData.dayOfWeek}</h2>
          <div class="day-info">
            <span>${weekData.title}</span>
          </div>
        </div>

        <div class="words-container" id="wordsContainer"></div>

        ${isCompleted ? `
          <div class="completed-badge">
            <span>🎉 已完成打卡</span>
          </div>
        ` : `
          <div class="checkin-section" id="checkinSection">
            <h3 class="checkin-title">今日打卡</h3>
            <p class="checkin-progress" id="checkinProgress">完成所有单词和例句的跟读录音</p>
            <button class="checkin-btn" id="checkinBtn" disabled>
              打卡完成
            </button>
          </div>
        `}
      `;

      renderWordsList(dayData);
      updateCheckInButton();
    }

    function renderWordsList(dayData) {
      const container = document.getElementById('wordsContainer');

      if (!container) {
        return;
      }

      container.innerHTML = '';

      if (!dayData.words || dayData.words.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">暂无学习内容</p>';
        return;
      }

      dayData.words.forEach((word, wordIndex) => {
        const wordCard = createWordCard(word, wordIndex);
        container.appendChild(wordCard);
        bindWordCardEvents(word, wordIndex);
      });
    }

    function createWordCard(word, wordIndex) {
      const card = document.createElement('div');
      card.className = 'word-card';

      const wordRecorded = progressManager.isWordRecorded(currentGlobalDayIndex, wordIndex);

      // 微信浏览器中不显示录音按钮
      const showRecordButtons = !isWeChat;

      card.innerHTML = `
        <div class="word-header">
          <div class="word-main">
            <span class="word-en">${word.en}</span>
            <span class="word-cn">${word.cn}</span>
          </div>
          <div class="word-audio-section">
            <button class="play-btn" id="word-play-${wordIndex}" title="播放发音">🔊</button>
            ${showRecordButtons ? `<button class="record-btn" id="word-record-${wordIndex}" title="按住录音">🎤</button>` : ''}
            ${showRecordButtons && wordRecorded ? `<button class="play-record-btn" id="word-play-record-${wordIndex}" title="播放录音">▶️</button>` : ''}
          </div>
        </div>

        ${showRecordButtons && wordRecorded ? '<div class="word-completion-status show">✓ 已录音</div>' : ''}

        <div class="examples-section" id="examples-section-${wordIndex}">
          ${word.examples.map((example, exampleIndex) => {
            const exampleRecorded = progressManager.isExampleRecorded(currentGlobalDayIndex, wordIndex, exampleIndex);
            return `
              <div class="example-item ${showRecordButtons && exampleRecorded ? 'completed' : ''}">
                <span class="example-cn">${example.cn}</span>
                <div class="example-en">
                  <span class="example-text">${example.en}</span>
                  <div class="example-audio-section">
                    <button class="example-play-btn" id="example-play-${wordIndex}-${exampleIndex}" title="播放发音">🔊</button>
                    ${showRecordButtons ? `<button class="example-record-btn" id="example-record-${wordIndex}-${exampleIndex}" title="按住录音">🎤</button>` : ''}
                    ${showRecordButtons && exampleRecorded ? `<button class="example-play-record-btn" id="example-play-record-${wordIndex}-${exampleIndex}" title="播放录音">▶️</button>` : ''}
                  </div>
                </div>
                ${showRecordButtons && exampleRecorded ? '<div class="example-completion-status show">✓ 已录音</div>' : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;

      return card;
    }

    function bindWordCardEvents(word, wordIndex) {
      // 绑定单词播放按钮
      const wordPlayBtn = document.getElementById(`word-play-${wordIndex}`);
      if (wordPlayBtn) {
        wordPlayBtn.addEventListener('click', async () => {
          audioPlayer.stopAll();
          wordPlayBtn.classList.add('playing');

          try {
            await audioPlayer.play(word.en, { rate: 0.85 });
          } catch (error) {
            console.error('播放失败:', error);
            if (audioPlayer.isHarmonyOS) {
              alert('鸿蒙系统音频播放受限，建议使用 Chrome 浏览器或微信内置浏览器。您仍可以正常进行录音学习。');
            } else {
              alert('播放失败，请重试');
            }
          }

          wordPlayBtn.classList.remove('playing');
        });
      }

      // 绑定单词录音按钮
      const wordRecordBtn = document.getElementById(`word-record-${wordIndex}`);
      if (wordRecordBtn) {
        const wordRecorder = new LearningRecorder({
          maxDuration: 15,
          onStop: (audioBlob) => {
            progressManager.saveWordRecording(currentGlobalDayIndex, wordIndex, audioBlob);
            loadCurrentContent();
          }
        });

        createHoldRecordingButton(wordRecordBtn, wordRecorder, async (audioBlob) => {
        });
      }

      // 绑定单词播放录音按钮
      const wordPlayRecordBtn = document.getElementById(`word-play-record-${wordIndex}`);
      if (wordPlayRecordBtn) {
        wordPlayRecordBtn.addEventListener('click', async () => {
          const audioData = progressManager.getWordRecording(currentGlobalDayIndex, wordIndex);
          if (!audioData) return;

          audioPlayer.stopAll();
          wordPlayRecordBtn.classList.add('playing');

          try {
            await audioPlayer.playRecording(audioData);
          } catch (error) {
            console.error('播放录音失败:', error);
            alert('播放录音失败，请重试');
          }

          wordPlayRecordBtn.classList.remove('playing');
        });
      }

      // 绑定例句的按钮
      word.examples.forEach((example, exampleIndex) => {
        // 绑定例句播放按钮
        const examplePlayBtn = document.getElementById(`example-play-${wordIndex}-${exampleIndex}`);
        if (examplePlayBtn) {
          examplePlayBtn.addEventListener('click', async () => {
            audioPlayer.stopAll();
            examplePlayBtn.classList.add('playing');

            try {
              await audioPlayer.play(example.en, { rate: 0.85 });
            } catch (error) {
              console.error('播放失败:', error);
              if (audioPlayer.isHarmonyOS) {
                alert('鸿蒙系统音频播放受限，建议使用 Chrome 浏览器或微信内置浏览器。您仍可以正常进行录音学习。');
              } else {
                alert('播放失败，请重试');
              }
            }

            examplePlayBtn.classList.remove('playing');
          });
        }

        // 绑定例句录音按钮
        const exampleRecordBtn = document.getElementById(`example-record-${wordIndex}-${exampleIndex}`);
        if (exampleRecordBtn) {
          const exampleRecorder = new LearningRecorder({
            maxDuration: 30,
            onStop: (audioBlob) => {
              progressManager.saveExampleRecording(currentGlobalDayIndex, wordIndex, exampleIndex, audioBlob);
              loadCurrentContent();
            }
          });

          createHoldRecordingButton(exampleRecordBtn, exampleRecorder, async (audioBlob) => {
          });
        }

        // 绑定例句播放录音按钮
        const examplePlayRecordBtn = document.getElementById(`example-play-record-${wordIndex}-${exampleIndex}`);
        if (examplePlayRecordBtn) {
          examplePlayRecordBtn.addEventListener('click', async () => {
            const audioData = progressManager.getExampleRecording(currentGlobalDayIndex, wordIndex, exampleIndex);
            if (!audioData) return;

            audioPlayer.stopAll();
            examplePlayRecordBtn.classList.add('playing');

            try {
              await audioPlayer.playRecording(audioData);
            } catch (error) {
              console.error('播放录音失败:', error);
              alert('播放录音失败，请重试');
            }

            examplePlayRecordBtn.classList.remove('playing');
          });
        }
      });
    }

    function updateCheckInButton() {
      const checkInBtn = document.getElementById('checkinBtn');
      const checkInProgress = document.getElementById('checkinProgress');

      if (!checkInBtn || !checkInProgress) return;

      const canCheckIn = progressManager.canCheckIn(currentGlobalDayIndex);

      if (canCheckIn) {
        checkInBtn.disabled = false;
        checkInBtn.textContent = '打卡完成';
        checkInProgress.textContent = '🎉 恭喜！已完成所有任务，可以打卡了';

        checkInBtn.onclick = () => {
          if (progressManager.checkIn(currentGlobalDayIndex)) {
            alert('✅ 打卡成功！');
            updateProgress();
            loadCurrentContent();
          }
        };
      } else {
        // 在微信浏览器中，允许直接打卡，因为录音功能不可用
        if (isWeChat) {
          checkInBtn.disabled = false;
          checkInBtn.textContent = '学习打卡';
          checkInProgress.textContent = '📖 在微信浏览器中，完成学习后可直接打卡';

          checkInBtn.onclick = () => {
            if (progressManager.checkIn(currentGlobalDayIndex)) {
              alert('✅ 打卡成功！继续加油！');
              updateProgress();
              loadCurrentContent();
            }
          };
        } else {
          checkInBtn.disabled = true;
          const weekData = learningData[currentWeekIndex];
          const dayData = weekData.days[currentDayIndex];

          let completedCount = 0;
          let totalCount = 0;

          dayData.words.forEach((word, wordIndex) => {
            totalCount += 1 + word.examples.length;
            if (progressManager.isWordRecorded(currentGlobalDayIndex, wordIndex)) {
              completedCount++;
            }
            word.examples.forEach((example, exampleIndex) => {
              if (progressManager.isExampleRecorded(currentGlobalDayIndex, wordIndex, exampleIndex)) {
                completedCount++;
              }
            });
          });

          checkInBtn.textContent = '打卡完成';
          checkInProgress.textContent = `进度: ${completedCount}/${totalCount} - 请完成所有跟读录音`;
        }
      }
    }

    // 显示微信浏览器提示
    function showWeChatTip() {
      const app = document.getElementById('app');
      if (!app) return;

      app.innerHTML = `
        <div class="container" style="padding-top: 40px;">
          <div style="text-align: center; padding: 40px 20px;">
            <div style="font-size: 80px; margin-bottom: 20px;">📚</div>
            <h2 style="color: #333; font-size: 24px; margin-bottom: 20px;">欢迎学习印刷英语专业说</h2>
            
            <div style="background: #f8f9fa; border: 2px solid #dee2e6; padding: 25px; margin: 20px 0; text-align: left; border-radius: 12px;">
              <h3 style="color: #495057; font-size: 18px; margin-bottom: 15px;">📖 关于本应用</h3>
              <p style="color: #6c757d; margin-bottom: 10px; line-height: 1.8;">
                本应用是一个专注于印刷行业的英语学习工具，帮助印刷从业者提升专业英语水平。
              </p>
              <p style="color: #6c757d; margin-bottom: 10px; line-height: 1.8;">
                内容包含 30 天系统学习计划，涵盖印刷专业词汇、例句和实践应用。
              </p>
              <p style="color: #6c757d; margin-bottom: 10px; line-height: 1.8;">
                所有数据均存储在您的设备本地，不会上传到任何服务器。
              </p>
            </div>

            <div style="background: #d1ecf1; border-left: 4px solid #0c5460; padding: 20px; margin: 20px 0; text-align: left; border-radius: 8px;">
              <p style="color: #0c5460; margin-bottom: 10px; font-weight: bold;">ℹ️ 微信浏览器使用说明：</p>
              <ul style="color: #0c5460; padding-left: 20px; line-height: 1.8;">
                <li>✅ 文字学习功能完全正常</li>
                <li>✅ 音频播放功能正常</li>
                <li>⚠️ 录音功能在微信浏览器中不可用</li>
                <li>💾 学习进度会自动保存</li>
                <li>🔄 可以随时在浏览器中打开使用完整功能</li>
              </ul>
            </div>

            <div style="background: #fff3cd; border-left: 4px solid #856404; padding: 20px; margin: 20px 0; text-align: left; border-radius: 8px;">
              <p style="color: #856404; margin-bottom: 10px; font-weight: bold;">💡 如何使用录音功能：</p>
              <ul style="color: #856404; padding-left: 20px; line-height: 1.8;">
                <li>点击右上角菜单（⋮）</li>
                <li>选择"在浏览器中打开"</li>
                <li>在 Chrome 浏览器中可以正常使用录音功能</li>
              </ul>
            </div>

            <div style="background: #f8f9fa; padding: 15px; margin: 20px 0; text-align: left; border-radius: 8px; font-size: 12px; color: #6c757d;">
              <p style="margin-bottom: 5px;"><strong>免责声明：</strong></p>
              <p style="margin-bottom: 5px; line-height: 1.6;">本应用仅供英语学习使用，所有内容仅供参考。使用本应用即表示您同意自行承担使用风险。</p>
              <p style="line-height: 1.6;">我们尊重用户隐私，不会收集或存储任何个人信息。</p>
            </div>

            <button onclick="hideWeChatTip()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);">
              开始学习
            </button>

            <p style="color: #999; font-size: 13px; margin-top: 20px; line-height: 1.6;">
              建议在 Chrome 浏览器中使用，可以获得完整的学习体验。
            </p>
          </div>
        </div>
      `;
    }

    // 隐藏微信提示，继续使用
    function hideWeChatTip() {
      const app = document.getElementById('app');
      if (!app) return;

      const progress = progressManager.getProgress();

      const todayIndex = calculateTodayIndex();

      if (progress.currentDay >= todayIndex) {
        currentGlobalDayIndex = progress.currentDay;
      } else if (todayIndex >= 0) {
        currentGlobalDayIndex = todayIndex;
      } else {
        currentGlobalDayIndex = 0;
      }

      currentWeekIndex = Math.floor(currentGlobalDayIndex / 5);
      currentDayIndex = currentGlobalDayIndex % 5;

      renderApp(app);
    }

    function initApp() {
      const app = document.getElementById('app');
      if (!app) {
        console.error('App element not found');
        return;
      }

      // 检测是否在微信浏览器中
      if (isWeChat) {
        console.log('检测到微信浏览器');
        showWeChatTip();
      } else {
        const progress = progressManager.getProgress();

        const todayIndex = calculateTodayIndex();

        if (progress.currentDay >= todayIndex) {
          currentGlobalDayIndex = progress.currentDay;
        } else if (todayIndex >= 0) {
          currentGlobalDayIndex = todayIndex;
        } else {
          currentGlobalDayIndex = 0;
        }

        currentWeekIndex = Math.floor(currentGlobalDayIndex / 5);
        currentDayIndex = currentGlobalDayIndex % 5;

        renderApp(app);
      }

      detectHarmonyOS();

      // 初始化音频（特别是 iOS 需要用户交互后才能播放音频）
      initAudioOnFirstInteraction();
    }

    // 在用户首次交互时初始化音频
    function initAudioOnFirstInteraction() {
      let audioInitialized = false;

      const handleFirstInteraction = async () => {
        if (!audioInitialized) {
          try {
            await audioPlayer.initAudio();
            audioInitialized = true;
            console.log('音频已初始化');

            // 移除事件监听器
            document.removeEventListener('click', handleFirstInteraction);
            document.removeEventListener('touchstart', handleFirstInteraction);
            document.removeEventListener('touchend', handleFirstInteraction);
          } catch (error) {
            console.warn('音频初始化失败:', error);
          }
        }
      };

      // 添加多种事件监听器以确保音频被初始化
      document.addEventListener('click', handleFirstInteraction, { once: true });
      document.addEventListener('touchstart', handleFirstInteraction, { once: true });
      document.addEventListener('touchend', handleFirstInteraction, { once: true });
    }

    // 等待 DOM 加载完成后初始化应用
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

  </script>

  <style>

      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 允许文本选择 */
    .word-en, .word-cn, .example-text, .example-cn {
      -webkit-user-select: text;
      user-select: text;
    }
